syntax = "proto3";

option csharp_namespace = "DatabaseGrpcService";

import "google/protobuf/struct.proto";
import "google/protobuf/empty.proto";

service DatabaseManager {
  rpc GetTables (google.protobuf.Empty) returns (GetTablesResponse);
  rpc GetTableSchema (GetTableSchemaRequest) returns (GetTableSchemaResponse);
  rpc GetTableData (GetTableDataRequest) returns (GetTableDataResponse);
  rpc CreateTable (TableDefinition) returns (google.protobuf.Empty);
  rpc InsertData (InsertDataRequest) returns (google.protobuf.Empty);
}

message GetTablesResponse {
  repeated string table_names = 1;
}

message GetTableSchemaRequest {
  string table_name = 1;
}
message GetTableSchemaResponse {
  repeated ColumnDefinition columns = 1;
}

message GetTableDataRequest {
  string table_name = 1;
}

message GetTableDataResponse {
  repeated google.protobuf.Struct rows = 1;
}

message TableDefinition {
  string table_name = 1;
  repeated ColumnDefinition columns = 2;
}
message ColumnDefinition {
  string name = 1;
  string type = 2;
}

message InsertDataRequest {
  string table_name = 1;
  map<string, google.protobuf.Value> data = 2;
}
