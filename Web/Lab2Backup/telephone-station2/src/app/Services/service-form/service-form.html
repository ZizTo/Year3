<p>service-form works!</p>

<div *ngIf="service" class="card mt-4">
  <div class="card-header">
    {{ isNew ? 'Создание новой услуги' : 'Редактирование услуги #' + service.id }}
  </div>
  <div class="card-body">
    <form #serviceForm="ngForm" (ngSubmit)="onSubmit(serviceForm)">
      <div class="mb-3">
        <label for="description" class="form-label">Описание</label>
        <input type="text" class="form-control" id="description" name="description"
               required
               [(ngModel)]="service.description"
               #description="ngModel">
        <div *ngIf="description.invalid && (description.dirty || description.touched)" class="text-danger mt-1">
          <div *ngIf="description.errors?.['required']">
            Описание обязательно для заполнения.
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label for="price" class="form-label">Цена</label>
        <input type="number" class="form-control" id="price" name="price"
               required
               [(ngModel)]="service.price"
               #price="ngModel">
        <div *ngIf="price.invalid && (price.dirty || price.touched)" class="text-danger mt-1">
            <div *ngIf="price.errors?.['required']">
                Цена обязательна для заполнения.
            </div>
        </div>
      </div>

      <div class="d-flex justify-content-between">
        <div>
          <button type="submit" class="btn btn-primary" [disabled]="!serviceForm.form.valid">
            Сохранить
          </button>
          <button type="button" class="btn btn-secondary" (click)="goBack()">
            Отмена
          </button>
        </div>
        <button *ngIf="!isNew" type="button" class="btn btn-danger" (click)="deleteService()">
          Удалить
        </button>
      </div>

    </form>
  </div>
</div>
