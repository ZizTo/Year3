<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Phone Station Menu</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        .container { max-width: 800px; margin: auto; }
        .form-section { border: 1px solid #ccc; padding: 1em; margin-bottom: 1em; border-radius: 5px; }
        .footer-info { margin-top: 2em; font-size: 0.9em; color: #555; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Phone Station Management</h1>

        <div th:if="${error}" class="error">
            <p th:text="${error}"></p>
        </div>

        <div class="form-section">
            <h2>View All Services</h2>
            <form action="app" method="get">
                <input type="hidden" name="action" value="listAllServices">
                <button type="submit">List All Available Services</button>
            </form>
        </div>

        <div class="form-section">
            <h2>Subscriber Information</h2>
            <form action="app" method="post">
                <input type="hidden" name="action" value="getSubscriberInfo">
                <label for="subIdInfo">Enter Subscriber ID:</label>
                <input type="number" id="subIdInfo" name="subscriberId" required>
                <button type="submit">Get Info</button>
            </form>
        </div>

        <div class="form-section">
            <h2>Block a Subscriber</h2>
            <form action="app" method="post">
                <input type="hidden" name="action" value="blockSubscriber">
                <label for="subIdBlock">Enter Subscriber ID to Block:</label>
                <input type="number" id="subIdBlock" name="subscriberId" required>
                <button type="submit">Block Subscriber</button>
            </form>
        </div>

        <div class="footer-info">
            <p>Your visit count: <span th:text="${#request.getAttribute('visitCount')}">0</span></p>
            <p>Your last visit was on: <span th:text="${#request.getAttribute('lastVisitTime')}">N/A</span></p>
        </div>
    </div>
</body>
</html>
