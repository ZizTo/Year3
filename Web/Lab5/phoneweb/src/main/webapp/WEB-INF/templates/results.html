<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Results</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        .container { max-width: 800px; margin: auto; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .message { border: 1px solid #28a745; background-color: #e9f7ef; padding: 1em; border-radius: 5px;}
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${title}">Results</h1>

    <!-- Display a simple message -->
    <div th:if="${message}" class="message">
        <p th:text="${message}"></p>
    </div>

    <!-- Display a list of services -->
    <div th:if="${services}">
        <table th:unless="${services.isEmpty()}">
            <thead>
            <tr>
                <th>Service ID</th>
                <th>Name</th>
                <th>Monthly Cost</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="service : ${services}">
                <td th:text="${service.id}"></td>
                <td th:text="${service.name}"></td>
                <td th:text="${service.monthlyCost} + ' RUB'"></td>
            </tr>
            </tbody>
        </table>
    </div>
    
    <p><a href="app?action=home">Back to Main Menu</a></p>
</div>
</body>
</html>
