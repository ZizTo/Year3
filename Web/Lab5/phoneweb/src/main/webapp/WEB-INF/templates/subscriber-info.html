<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Subscriber Information</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        .container { max-width: 800px; margin: auto; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 1em;}
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .no-data { color: #888; }
        .bill-section { border: 1px solid #007bff; padding: 1em; border-radius: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${title}">Subscriber Info</h1>

    <h2>Active Services</h2>
    <div th:if="${services.isEmpty()}">
        <p class="no-data">This subscriber has no active services.</p>
    </div>
    <table th:unless="${services.isEmpty()}">
        <thead>
        <tr>
            <th>Service ID</th>
            <th>Name</th>
            <th>Monthly Cost</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="service : ${services}">
            <td th:text="${service.id}"></td>
            <td th:text="${service.name}"></td>
            <td th:text="${service.monthlyCost} + ' RUB'"></td>
        </tr>
        </tbody>
    </table>

    <h2>Unpaid Bill</h2>
    <div th:if="${unpaidBill == null}">
        <p class="no-data">No unpaid bills found for this subscriber.</p>
    </div>
    <div th:unless="${unpaidBill == null}" class="bill-section">
        <h3>Bill Details</h3>
        <p><strong>Bill ID:</strong> <span th:text="${unpaidBill.id}"></span></p>
        <p><strong>Amount:</strong> <span th:text="${unpaidBill.amount}"></span> RUB</p>
        <p><strong>Issue Date:</strong> <span th:text="${unpaidBill.issueDate}"></span></p>
        <form action="app" method="post">
            <input type="hidden" name="action" value="payBill">
            <input type="hidden" name="billId" th:value="${unpaidBill.id}">
            <button type="submit">Pay This Bill</button>
        </form>
    </div>
    
    <p><a href="app?action=home">Back to Main Menu</a></p>
</div>
</body>
</html>
