<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title th:text="#{app.services}">Услуги</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #28a745; color: white; }
        .btn { padding: 5px 10px; margin: 5px; text-decoration: none; border-radius: 3px; display: inline-block; }
        .btn-primary { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .pagination { margin-top: 20px; }
        .pagination a, .pagination span { padding: 8px 12px; margin: 5px; text-decoration: none; background: #f0f0f0; border-radius: 3px; display: inline-block; }
        .pagination a:hover { background: #28a745; color: white; }
        .pagination .active { background: #28a745; color: white; }
        .lang-switcher { margin-bottom: 20px; padding: 10px; background: #f0f0f0; border-radius: 5px; }
        .lang-switcher a { margin-right: 10px; padding: 5px 10px; text-decoration: none; color: #28a745; }
        .actions { margin-bottom: 20px; }
    </style>
</head>
<body>
    <!-- Переключатель языков -->
    <div class="lang-switcher">
        <strong>Язык:</strong>
        <a th:href="@{/services(lang='ru')}">🇷🇺 Русский</a>
        <a th:href="@{/services(lang='en')}">🇬🇧 English</a>
        <a th:href="@{/services(lang='de')}">🇩🇪 Deutsch</a>
    </div>

    <h1 th:text="#{app.services}">Список услуг</h1>
    
    <div class="actions">
        <a th:href="@{/services/new}" class="btn btn-primary" th:text="'+ ' + #{app.add}">+ Добавить услугу</a>
        <a th:href="@{/}" class="btn btn-primary" th:text="'← ' + #{app.home}">← На главную</a>
    </div>
    
    <table th:if="${!services.isEmpty()}">
        <tr>
            <th th:text="#{app.id}">ID</th>
            <th th:text="#{app.name}">Название</th>
            <th th:text="#{app.cost}">Цена (руб/мес)</th>
            <th th:text="#{app.actions}">Действия</th>
        </tr>
        <tr th:each="service : ${services}">
            <td th:text="${service.id}"></td>
            <td th:text="${service.name}"></td>
            <td th:text="${#numbers.formatDecimal(service.monthlyCost, 1, 2)}"></td>
            <td>
                <a th:href="@{/services/edit/{id}(id=${service.id})}" class="btn btn-primary" th:text="#{app.edit}">Редактировать</a>
                <a th:href="@{/services/delete/{id}(id=${service.id})}" class="btn btn-danger" th:text="#{app.delete}" onclick="return confirm('Удалить?')">Удалить</a>
            </td>
        </tr>
    </table>
    <p th:if="${services.isEmpty()}">Нет услуг в системе</p>

    <!-- Пагинация -->
    <div class="pagination" th:if="${totalPages > 1}">
        <span th:text="#{pagination.page} + ' ' + ${currentPage + 1} + ' ' + #{pagination.of} + ' ' + ${totalPages}">Страница 1 из 5</span>
        <br/><br/>
        
        <a th:if="${currentPage > 0}" th:href="@{/services(page=0)}">« Первая</a>
        <a th:if="${currentPage > 0}" th:href="@{/services(page=${currentPage - 1})}">← Предыдущая</a>
        
        <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
           th:href="@{/services(page=${i})}"
           th:class="${i == currentPage ? 'active' : ''}"
           th:text="${i + 1}">1</a>
        
        <a th:if="${currentPage < totalPages - 1}" th:href="@{/services(page=${currentPage + 1})}">Следующая →</a>
        <a th:if="${currentPage < totalPages - 1}" th:href="@{/services(page=${totalPages - 1})}">Последняя »</a>
    </div>
</body>
</html>
