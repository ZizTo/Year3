<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title th:text="#{app.title}">Система управления абонентами</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin: 15px 0; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn { padding: 10px 20px; margin: 10px 5px 10px 0; border: none; border-radius: 5px; cursor: pointer; }
        .btn-primary { background: #ff9800; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .lang-switcher { margin-bottom: 20px; padding: 10px; background: #f0f0f0; border-radius: 5px; }
        .lang-switcher a { margin-right: 10px; padding: 5px 10px; text-decoration: none; color: #ff9800; }
    </style>
</head>
<body>
    <!-- Переключатель языков -->
    <div class="lang-switcher">
        <strong>Язык:</strong>
        <a th:href="@{/bills/new(lang='ru')}">🇷🇺 Русский</a>
        <a th:href="@{/bills/new(lang='en')}">🇬🇧 English</a>
        <a th:href="@{/bills/new(lang='de')}">🇩🇪 Deutsch</a>
    </div>

    <h1>Добавить счет</h1>
    
    <form th:action="@{/bills}" th:object="${bill}" method="POST">
        <input type="hidden" th:field="*{id}" th:if="*{id}">
        
        <div class="form-group">
            <label>Абонент:</label>
            <select th:field="*{subscriber}">
                <option value="">-- Выберите абонента --</option>
                <option th:each="sub : ${subscribers}" 
                        th:value="${sub.id}" 
                        th:text="${sub.fullName}">
                </option>
            </select>
        </div>
        
        <div class="form-group">
            <label th:text="#{app.amount}">Сумма (руб):</label>
            <input type="number" th:field="*{amount}" step="0.01" required>
        </div>
        
        <div class="form-group">
            <label th:text="#{app.date}">Дата выставления:</label>
            <input type="date" th:field="*{issueDate}" required>
        </div>
        
        <div class="form-group">
            <label th:text="#{app.paid}">Оплачен:</label>
            <select th:field="*{paid}">
                <option value="false">Нет</option>
                <option value="true">Да</option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary" th:text="#{app.save}">Сохранить</button>
        <a th:href="@{/bills}" class="btn btn-secondary" th:text="#{app.cancel}">Отмена</a>
    </form>
</body>
</html>
